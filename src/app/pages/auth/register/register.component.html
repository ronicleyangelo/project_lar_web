<div class="auth-wrapper">
  <app-auth-background></app-auth-background>
  <div class="auth-card card">
    <div class="card-body p-4">
      <div class="auth-intro text-center">
        <span class="auth-symbol icon">person_add</span>
        <span class="auth-eyebrow">Comece agora</span>
        <h3 class="auth-title">Crie sua conta</h3>
        <p>Escolha seu perfil e faça parte da nossa comunidade.</p>
      </div>
      
      <div class="d-flex justify-content-center mb-4">
        <div class="d-flex gap-3 role-selector" role="group">
          <input type="radio" class="btn-check" name="role" id="client" value="CLIENT" [(ngModel)]="registerRole">
          <label class="btn btn-outline-primary rounded-pill" for="client">Sou Cliente</label>

          <input type="radio" class="btn-check" name="role" id="provider" value="PROVIDER" [(ngModel)]="registerRole">
          <label class="btn btn-outline-primary rounded-pill" for="provider">Sou Profissional</label>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <div class="mb-3">
        <label class="form-label">Nome Completo</label>
        <input type="text" class="form-control" [(ngModel)]="fullName">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email">
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" [(ngModel)]="password">
      </div>
      <div class="mb-3">
        <label class="form-label">Telefone / WhatsApp</label>
        <input
          type="tel"
          class="form-control"
          [(ngModel)]="phone"
          (input)="onPhoneInput($event)"
          placeholder="(27) 99999-9999"
          inputmode="numeric"
          autocomplete="tel-national"
          maxlength="15">
      </div>
      <div class="mb-3">
        <label class="form-label">Bairro</label>
        <input type="text" class="form-control" [(ngModel)]="neighborhood" placeholder="Ex.: Moema" autocomplete="address-level3">
      </div>
      <div class="mb-3">
        <label class="form-label">Cidade</label>
        <input type="text" class="form-control" [(ngModel)]="city" placeholder="Ex.: São Paulo" autocomplete="address-level2">
      </div>

      <ng-container *ngIf="registerRole === 'CLIENT'">
        <div class="mb-3">
          <label class="form-label">Endereço Completo (Protegido)</label>
          <input type="text" class="form-control" [(ngModel)]="fullAddress">
        </div>
      </ng-container>

      <ng-container *ngIf="registerRole === 'PROVIDER'">
        <div class="mb-3">
          <label class="form-label">Bio / Qualificações</label>
          <textarea class="form-control" rows="2" [(ngModel)]="bio"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Raio de Atendimento (km)</label>
          <input type="number" class="form-control" [(ngModel)]="serviceRadiusKm">
        </div>
      </ng-container>

      <button class="btn btn-primary w-100 auth-btn mt-3" [disabled]="isLoading" (click)="onRegister()">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Cadastrando...' : 'Cadastrar' }}
      </button>
      
      <div class="mt-3 text-center">
        <a routerLink="/auth/login" class="auth-link">Já tem conta? Faça Login</a>
      </div>
    </div>
  </div>
</div>
