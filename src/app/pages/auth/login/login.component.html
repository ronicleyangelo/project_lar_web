<div class="auth-wrapper">
  <app-auth-background></app-auth-background>
  <div class="auth-card card">
    <div class="card-body p-4">
      <div class="auth-intro text-center">
        <h3 class="auth-title">Acesse sua conta</h3>
        <p>Acesse seus pedidos, propostas e agendamentos.</p>
      </div>
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" placeholder="voce@email.com" autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" [(ngModel)]="password" placeholder="Digite sua senha" autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100 auth-btn" [disabled]="isLoading" (click)="onLogin()">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Entrando...' : 'Login' }}
      </button>
      <div class="auth-divider"><span>ou</span></div>
      <button type="button" class="google-auth-btn" disabled aria-label="Autenticação com Google ainda não configurada">
        <span class="google-mark">G</span>
        Continuar com Google
        <span class="google-soon">Em breve</span>
      </button>
      <div class="mt-3 text-center">
        <a routerLink="/auth/register" class="auth-link">Não tem conta? Cadastre-se</a>
      </div>
    </div>
  </div>
</div>
