<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Projeto Lar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#a7472a">
  <meta name="description" content="Encontre e contrate profissionais confiáveis para sua casa com avaliações verificadas e recomendações transparentes.">
  <meta name="application-name" content="Projeto Lar">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Projeto Lar">

  <!-- Security: Content-Security-Policy fallback -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: http://localhost:3000 https://project-lar-api.onrender.com https://images.unsplash.com https://*.googleusercontent.com; connect-src 'self' http://localhost:3000 https://project-lar-api.onrender.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com;">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/app-icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon-180.png">

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <div style="
      position:fixed; top:0; left:0; width:100vw; height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background: linear-gradient(135deg, #edf3ef 0%, #f4e6df 100%);
      gap: 20px;
      font-family: 'Inter', sans-serif;
    ">
      <div style="
        width: 52px; height: 52px;
        border: 6px solid rgba(162,85,58,.15);
        border-top-color: #a2553a;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      "></div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      <span style="color:#a2553a; font-size:13px; font-weight:600; letter-spacing:.05em;">PROJETO LAR</span>
    </div>
  </app-root>
</body>
</html>
